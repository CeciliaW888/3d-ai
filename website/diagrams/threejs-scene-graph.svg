<svg viewBox="0 0 700 380" xmlns="http://www.w3.org/2000/svg" font-family="Inter, system-ui, sans-serif">
  <rect width="700" height="380" fill="#f0f7f6" rx="12"/>

  <text x="350" y="30" text-anchor="middle" font-size="15" font-weight="700" fill="#1a2e2c">Three.js Scene Graph</text>

  <defs>
    <marker id="arr3" markerWidth="8" markerHeight="7" refX="6" refY="3.5" orient="auto">
      <path d="M0,0 L0,7 L8,3.5 z" fill="#0d9488" opacity=".6"/>
    </marker>
  </defs>

  <!-- Scene (root) -->
  <rect x="270" y="50" width="160" height="50" rx="10" fill="#0d9488" stroke="#0d9488" stroke-width="2"/>
  <text x="350" y="71" text-anchor="middle" font-size="13" font-weight="700" fill="white">THREE.Scene</text>
  <text x="350" y="88" text-anchor="middle" font-size="10" fill="rgba(255,255,255,0.8)">Root container</text>

  <!-- Edges from Scene -->
  <line x1="290" y1="100" x2="160" y2="148" stroke="#0d9488" stroke-width="1.5" opacity=".5" marker-end="url(#arr3)"/>
  <line x1="350" y1="100" x2="350" y2="148" stroke="#0d9488" stroke-width="1.5" opacity=".5" marker-end="url(#arr3)"/>
  <line x1="410" y1="100" x2="540" y2="148" stroke="#0d9488" stroke-width="1.5" opacity=".5" marker-end="url(#arr3)"/>

  <!-- Camera -->
  <rect x="80" y="150" width="160" height="60" rx="8" fill="#7c3aed" opacity=".15" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="160" y="175" text-anchor="middle" font-size="12" font-weight="600" fill="#7c3aed">PerspectiveCamera</text>
  <text x="160" y="192" text-anchor="middle" font-size="10" fill="#4b6360">fov, near, far, aspect</text>

  <!-- Light group -->
  <rect x="270" y="150" width="160" height="60" rx="8" fill="#f59e0b" opacity=".15" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="350" y="175" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">Lights</text>
  <text x="350" y="192" text-anchor="middle" font-size="10" fill="#4b6360">Ambient / Directional</text>

  <!-- Mesh group -->
  <rect x="460" y="150" width="160" height="60" rx="8" fill="#10b981" opacity=".15" stroke="#10b981" stroke-width="1.5"/>
  <text x="540" y="175" text-anchor="middle" font-size="12" font-weight="600" fill="#065f46">Mesh</text>
  <text x="540" y="192" text-anchor="middle" font-size="10" fill="#4b6360">Geometry + Material</text>

  <!-- Mesh children -->
  <line x1="490" y1="210" x2="420" y2="258" stroke="#10b981" stroke-width="1.5" opacity=".5" marker-end="url(#arr3)"/>
  <line x1="540" y1="210" x2="540" y2="258" stroke="#10b981" stroke-width="1.5" opacity=".5" marker-end="url(#arr3)"/>
  <line x1="590" y1="210" x2="650" y2="258" stroke="#10b981" stroke-width="1.5" opacity=".5" marker-end="url(#arr3)"/>

  <rect x="340" y="260" width="140" height="55" rx="8" fill="#10b981" opacity=".1" stroke="#10b981" stroke-width="1"/>
  <text x="410" y="283" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">BoxGeometry</text>
  <text x="410" y="299" text-anchor="middle" font-size="10" fill="#4b6360">width, height, depth</text>

  <rect x="490" y="260" width="140" height="55" rx="8" fill="#10b981" opacity=".1" stroke="#10b981" stroke-width="1"/>
  <text x="560" y="283" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">MeshStandardMaterial</text>
  <text x="560" y="299" text-anchor="middle" font-size="10" fill="#4b6360">color, roughness, map</text>

  <rect x="180" y="260" width="140" height="55" rx="8" fill="#10b981" opacity=".1" stroke="#10b981" stroke-width="1"/>
  <text x="250" y="283" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">GLTFLoader</text>
  <text x="250" y="299" text-anchor="middle" font-size="10" fill="#4b6360">load AI-generated .glb</text>

  <!-- Renderer note at bottom -->
  <rect x="200" y="342" width="300" height="28" rx="6" fill="#0d9488" opacity=".12" stroke="#0d9488" stroke-width="1"/>
  <text x="350" y="361" text-anchor="middle" font-size="11" fill="#0d9488" font-weight="500">WebGLRenderer renders Scene from Camera view</text>

  <!-- Code snippet hint -->
  <text x="16" y="290" font-size="9" fill="#7a9e9b" font-family="JetBrains Mono, monospace">scene.add(mesh)</text>
  <text x="16" y="305" font-size="9" fill="#7a9e9b" font-family="JetBrains Mono, monospace">scene.add(camera)</text>
  <text x="16" y="320" font-size="9" fill="#7a9e9b" font-family="JetBrains Mono, monospace">renderer.render(scene, camera)</text>
</svg>
