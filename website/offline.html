<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — 3D AI for the Web</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f0f7f6; color: #1a2e2c;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 24px; text-align: center;
    }
    .card {
      background: white; border-radius: 16px; padding: 48px 32px;
      max-width: 400px; box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    }
    .icon { font-size: 64px; margin-bottom: 16px; }
    h1 { font-size: 24px; margin-bottom: 8px; }
    p { color: #4b6360; margin-bottom: 24px; line-height: 1.5; }
    .btn {
      background: #0d9488; color: white; border: none;
      padding: 12px 32px; border-radius: 8px; font-size: 16px;
      font-weight: 600; cursor: pointer;
    }
    .btn:hover { background: #0f766e; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">📡</div>
    <h1>You're offline</h1>
    <p>This page hasn't been cached yet. Visit it once while online and it'll be available offline.</p>
    <button class="btn" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
